<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kusi DataHub</title>
<style>
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:24px;background:#171717}
h1{color:#ffd400}
main{max-width:500px;margin:auto;padding:20px}
label{display:block;margin:18px 0 8px}
select,input{width:100%;padding:13px;box-sizing:border-box;background:#222;color:white;border:1px solid #555;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:22px;background:#ffd400;color:#111;border:0;border-radius:8px;font-size:16px;font-weight:bold}
p{color:#bbb;line-height:1.5}
#result{display:none;white-space:pre-line;background:#171717;padding:15px;margin-top:20px;border-radius:8px}
small{color:#aaa}
</style>
</head>
<body>
<header>
<h1>KUSI DATAHUB</h1>
<p>Your Data, Your Connection 🇬🇭</p>
</header>
<main>
<h2>Place Your Order</h2>
<p>Choose a network, data bundle and the phone number that should receive the data.</p>

<form id="orderForm">
<label for="network">Network</label>
<select id="network">
<option>MTN</option>
<option>Telecel</option>
<option>AT</option>
</select>

<label for="bundle">Data bundle</label>
<select id="bundle"></select>

<label for="phone">Phone number to receive data</label>
<input id="phone" type="tel" placeholder="e.g. 0241234567" required>

<label for="name">Your name (optional)</label>
<input id="name" type="text" placeholder="Enter your name">

<button type="submit">Review My Order</button>
</form>

<div id="result" role="status"></div>
<p><small>Prices are examples only, not confirmed offers. This demonstration does not send orders or deliver data yet. Never enter your Mobile Money PIN.</small></p>
</main>
<script>
const offers={
 MTN:[["1 GB",5],["2 GB",10],["5 GB",22]],
 Telecel:[["1 GB",5],["2 GB",10],["5 GB",22]],
 AT:[["1 GB",5],["2 GB",10],["5 GB",22]]
};
const network=document.getElementById("network");
const bundle=document.getElementById("bundle");
const result=document.getElementById("result");

function updateBundles(){
 bundle.innerHTML="";
 offers[network.value].forEach(item=>{
  const option=document.createElement("option");
  option.value=item[0];
  option.textContent=item[0]+" — sample GH₵"+item[1];
  bundle.appendChild(option);
 });
 result.style.display="none";
}
network.addEventListener("change",updateBundles);
updateBundles();

document.getElementById("orderForm").addEventListener("submit",function(e){
 e.preventDefault();
 const offer=offers[network.value].find(x=>x[0]===bundle.value);
 const phone=document.getElementById("phone").value.trim();
 if(!/^[0-9+\s()-]{9,16}$/.test(phone)){
  alert("Please enter a valid phone number.");
  return;
 }
 result.textContent=
 "ORDER SUMMARY\n"+
 "Network: "+network.value+"\n"+
 "Bundle: "+offer[0]+"\n"+
 "Phone: "+phone+"\n"+
 "Sample price: GH₵"+offer[1]+"\n\n"+
 "This is a preview only. Your order has NOT been sent to Kusi DataHub.";
 result.style.display="block";
});
</script>
</body>
</html>
